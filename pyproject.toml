[project]
name = "photosorter"
version = "0.1.0"
description = "Aplicacion de escritorio para organizar fotografias por orientacion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.7,<6.10",
    "pillow>=10.4",
    "rawpy>=0.21",
]

[project.scripts]
photosorter = "photosorter.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photosorter"]

[tool.hatch.build.targets.wheel.force-include]
"src/photosorter/resources/icon.png" = "photosorter/resources/icon.png"
"src/photosorter/resources/icon.ico" = "photosorter/resources/icon.ico"
"src/photosorter/resources/logo.png" = "photosorter/resources/logo.png"

# La landing page vive en el repo pero no forma parte de la app: se excluye
# del sdist (el wheel y el .exe ya toman solo src/photosorter).
[tool.hatch.build.targets.sdist]
exclude = ["/photo-sorter-landing-page-design"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
